<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Бабкины Семечки — Mini App</title>

  <link rel="stylesheet" href="style.css">
  
  <!-- Telegram & TON SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Шапка статистики -->
    <div class="stats-grid glass-card">
      <div class="stat-item">
        <span class="stat-label">За клик</span>
        <span class="stat-value" id="click-power-val">+1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Уровень</span>
        <span class="stat-value" id="user-level-val">1 (0 XP)</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Пассив/сек</span>
        <span class="stat-value" id="passive-income-val">+0</span>
      </div>
    </div>

    <!-- ТАБ 1: КЛИКЕР -->
    <div id="tab-clicker" class="tab-content active">
      <div class="main-clicker-zone">
        <div class="balance-title">БАЛАНС $SEMECHKI</div>
        <div class="balance-val">
          <span>🌻</span>
          <span id="balance-val">0</span>
        </div>

        <div class="clicker-container" id="clicker-btn">
          <div class="sunflower-btn">🌻</div>
        </div>

        <div class="energy-bar-wrap">
          <div class="energy-info">
            <span>⚡ Энергия</span>
            <span id="energy-val">1000 / 1000</span>
          </div>
          <div class="energy-track">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ТАБ 2: МАГАЗИН (30 АПГРЕЙДОВ) -->
    <div id="tab-shop" class="tab-content">
      <h2 style="margin-bottom: 12px;">🏪 Ларёк Прокачек</h2>
      <div id="upgrades-list" class="upgrades-list">
        <!-- Список 30 апгрейдов генерируется через JS -->
      </div>
    </div>

    <!-- ТАБ 3: TON КОШЕЛЕК & ЛИСТИНГ -->
    <div id="tab-wallet" class="tab-content">
      <h2 style="margin-bottom: 12px;">💎 TON Wallet & Airdrop</h2>
      <div class="glass-card" style="text-align: center; padding: 20px;">
        <h3>Подключи кошелёк</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin: 8px 0 16px 0;">
          Привяжи Tonkeeper, Telegram Wallet или MyTonWallet для участия в аирдропе $SEMECHKI.
        </p>
        <div id="ton-connect-btn"></div>
      </div>
    </div>

    <!-- ТАБ 4: РЕФЕРАЛЫ -->
    <div id="tab-friends" class="tab-content">
      <h2 style="margin-bottom: 12px;">👥 Пригласи друзей</h2>
      <div class="glass-card" style="padding: 16px;">
        <p>За каждого друга: <strong>+5,000 $SEMECHKI</strong></p>
        <button id="ref-btn" class="action-btn" style="margin-top: 12px; width: 100%;">
          Скопировать реф-ссылку
        </button>
      </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('clicker', this)">
        <span>🌻</span>
        Кликер
      </button>
      <button class="nav-btn" onclick="switchTab('shop', this)">
        <span>🏪</span>
        Ларёк
      </button>
      <button class="nav-btn" onclick="switchTab('wallet', this)">
        <span>💎</span>
        Кошелёк
      </button>
      <button class="nav-btn" onclick="switchTab('friends', this)">
        <span>👥</span>
        Друзья
      </button>
    </div>

  </div>

  <script src="upgrades.js"></script>
  <script src="app.js"></script>
</body>
</html>
